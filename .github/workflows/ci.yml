name: Student Management CI

on: 
  push:
    branches: 
      - main
  pull_requests:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: 
        java-version: '17'
        distribution: 'termurin'
        cache: 'maven'

    - name: Give exceute permissions to mvnw
      run: chmod +x mvnw

    - name: Build with Maven
      run: ./mvnw clean install 

    -name: Run tests
      run: ./mvnw test
