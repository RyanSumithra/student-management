name: Student Management CI

on: 
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: 
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Give execute permissions to mvnw
      run: chmod +x mvnw

    - name: Build Project
      run: ./mvnw clean install 

    - name: Run Tests
      run: ./mvnw test
